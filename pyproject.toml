[project]
name = "claimagent"
version = "0.1.0"
description = "Claim extraction and verification agent for speaker-product answers"
readme = "README.md"
authors = [
    { name = "Dhushyanthc", email = "dhushyanthc005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.1",
    "openai==3.22.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
